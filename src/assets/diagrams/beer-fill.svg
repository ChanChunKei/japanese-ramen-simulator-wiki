<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><title>Beer + foam: the 70% boundary</title><desc>Total fill matters. This is not a beer-to-foam mixing ratio.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ad3d2c"/></marker></defs><rect width="1200" height="675" fill="#f7f1e5"/><path d="M48 70H98" stroke="#ad3d2c" stroke-width="4"/><text x="112" y="78" fill="#ad3d2c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">RAMEN WIKI / VISUAL NOTES</text><text x="48" y="145" fill="#302820" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" text-anchor="start">Beer + foam: the 70% boundary</text><text x="48" y="185" fill="#766b5e" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">Total fill matters. This is not a beer-to-foam mixing ratio.</text><rect x="51" y="230" width="320" height="350" rx="18" fill="white" stroke="#d8ccba" stroke-width="2"/><path d="M310 325H354Q378 325 378 370V417Q378 457 310 457" fill="none" stroke="#302820" stroke-width="9"/><rect x="93" y="411.5" width="206" height="106.5" fill="#e8b24c"/><rect x="93" y="392.5" width="206" height="19" fill="#f4e3bd"/><rect x="86" y="260" width="220" height="265" rx="15" fill="none" stroke="#302820" stroke-width="7"/><path d="M74 342.3H318" stroke="#ad3d2c" stroke-width="3" stroke-dasharray="9 8"/><text x="196" y="478" fill="#302820" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">50%</text><text x="196" y="560" fill="#ad3d2c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Penalty</text><rect x="415" y="230" width="320" height="350" rx="18" fill="white" stroke="#d8ccba" stroke-width="2"/><path d="M674 325H718Q742 325 742 370V417Q742 457 674 457" fill="none" stroke="#302820" stroke-width="9"/><rect x="457" y="361.3" width="206" height="156.7" fill="#e8b24c"/><rect x="457" y="342.3" width="206" height="19" fill="#f4e3bd"/><rect x="450" y="260" width="220" height="265" rx="15" fill="none" stroke="#302820" stroke-width="7"/><path d="M438 342.3H682" stroke="#ad3d2c" stroke-width="3" stroke-dasharray="9 8"/><text x="560" y="478" fill="#302820" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">70%</text><text x="560" y="560" fill="#ad3d2c" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Penalty</text><rect x="779" y="230" width="320" height="350" rx="18" fill="white" stroke="#d8ccba" stroke-width="2"/><path d="M1038 325H1082Q1106 325 1106 370V417Q1106 457 1038 457" fill="none" stroke="#302820" stroke-width="9"/><rect x="821" y="323.65" width="206" height="194.35" fill="#e8b24c"/><rect x="821" y="304.65" width="206" height="19" fill="#f4e3bd"/><rect x="814" y="260" width="220" height="265" rx="15" fill="none" stroke="#302820" stroke-width="7"/><path d="M802 342.3H1046" stroke="#ad3d2c" stroke-width="3" stroke-dasharray="9 8"/><text x="924" y="478" fill="#302820" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">85%</text><text x="924" y="560" fill="#336a50" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Above the boundary</text><text x="50" y="607" fill="#766b5e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Above 70% avoids this specific low-fill penalty; it does not guarantee a perfect score.</text><path d="M48 617H1152" stroke="#d8ccba" stroke-width="2"/><text x="48" y="650" fill="#766b5e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Day 1 patch fact · illustrative foam amounts only · no fixed ideal ratio</text></svg>